  #   command: >
  #     sh -c '
  #       echo "URL=$$MEMORY_LLM_BASE_URL";
  #       echo "MODEL=$$MEMORY_LLM_MODEL";
  #       sleep infinity
  #     '

models:
  memory_llm:
    model: hf.co/unsloth/gemma-4-E4B-it-GGUF:Q4_K_M
