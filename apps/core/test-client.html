<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICOS</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #111;
        color: #eee;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .app {
        width: min(1200px, 100%);
        height: min(900px, 100vh);
        display: flex;
        flex-direction: column;
        background: #181818;
        border: 1px solid #333;
      }

      header {
        padding: 16px 20px;
        border-bottom: 1px solid #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      #session {
        color: #777;
        font-size: 11px;
        font-family: monospace;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 10px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .user {
        align-self: flex-end;
        background: #315b52;
      }

      .assistant {
        align-self: flex-start;
        background: #292929;
      }

      .system {
        align-self: center;
        color: #777;
        font-size: 12px;
      }

      .excluded {
        opacity: 0.45;
      }

      .composer {
        border-top: 1px solid #333;
        padding: 12px;
        display: flex;
        gap: 10px;
      }

      textarea {
        flex: 1;
        resize: none;
        min-height: 48px;
        max-height: 160px;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #111;
        color: #eee;
        font: inherit;
        outline: none;
      }

      textarea:focus {
        border-color: #666;
      }

      button {
        width: 80px;
        border: 0;
        border-radius: 8px;
        background: #6f8f82;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #82a598;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .typing {
        opacity: 0.5;
        font-style: italic;
      }

      .new-btn {
        width: auto;
        padding: 8px 14px;
        font-size: 13px;
      }

      .body {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      .sidebar {
        width: 260px;
        flex-shrink: 0;
        border-right: 1px solid #333;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      #search {
        margin: 12px;
        padding: 10px 12px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #111;
        color: #eee;
        font: inherit;
        font-size: 13px;
        outline: none;
      }

      #search:focus {
        border-color: #666;
      }

      #sessions {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .session-item {
        padding: 10px 12px;
        border: 1px solid #333;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
      }

      .session-item:hover {
        border-color: #555;
      }

      .session-item.active {
        border-color: #6f8f82;
        background: #202624;
      }

      .session-item .title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-item .meta {
        color: #777;
        font-size: 11px;
        margin-top: 4px;
        font-family: monospace;
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      @media (max-width: 700px) {
        .body {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          border-right: 0;
          border-bottom: 1px solid #333;
          max-height: 180px;
        }
      }

      @media (max-width: 600px) {
        body {
          align-items: stretch;
        }

        .app {
          height: 100%;
          border: 0;
        }

        #messages {
          padding: 16px;
        }

        .message {
          max-width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header>
        <h1>ICOS</h1>
        <span id="session">new session</span>
        <button class="new-btn" id="new" type="button">+ New</button>
      </header>

      <div class="body">
        <aside class="sidebar">
          <input id="search" placeholder="Search sessions..." autocomplete="off" />
          <div id="sessions"></div>
        </aside>

        <div class="main">
          <main id="messages">
            <div class="message system">Core online.</div>
          </main>

          <form class="composer" id="composer">
            <textarea
              id="input"
              placeholder="Talk to ICOS..."
              autocomplete="off"
              autofocus
            ></textarea>

            <button id="send" type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      let sessionId = null;

      const messages = document.getElementById('messages');
      const input = document.getElementById('input');
      const send = document.getElementById('send');
      const session = document.getElementById('session');
      const composer = document.getElementById('composer');
      const sessions = document.getElementById('sessions');
      const search = document.getElementById('search');
      const newButton = document.getElementById('new');

      function shortId(id) {
        return id.slice(0, 8);
      }

      function formatDate(iso) {
        return new Date(iso).toLocaleString();
      }

      function markActive() {
        for (const item of sessions.children) {
          item.classList.toggle('active', item.dataset.id === sessionId);
        }
      }

      function renderSessionItem(id, title, meta) {
        const item = document.createElement('div');
        item.className = 'session-item';
        item.dataset.id = id;

        const titleEl = document.createElement('div');
        titleEl.className = 'title';
        titleEl.textContent = title;

        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = meta;

        item.appendChild(titleEl);
        item.appendChild(metaEl);
        item.addEventListener('click', () => openSession(id));
        sessions.appendChild(item);
      }

      async function refreshSessions() {
        if (search.value.trim()) {
          return;
        }

        try {
          const response = await fetch('/core/sessions?limit=50');
          const data = await response.json();

          sessions.replaceChildren();

          for (const s of data.sessions) {
            renderSessionItem(
              s.sessionId,
              s.title || s.preview || `Session ${shortId(s.sessionId)}`,
              `${s.messageCount} msgs · ${formatDate(s.updatedAt)}`,
            );
          }

          markActive();
        } catch {
          // Sidebar is auxiliary; chat must keep working.
        }
      }

      let searchTimer = null;

      search.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(runSearch, 250);
      });

      async function runSearch() {
        const q = search.value.trim();

        if (!q) {
          await refreshSessions();
          return;
        }

        try {
          const response = await fetch(
            `/core/sessions/search?q=${encodeURIComponent(q)}&limit=50`,
          );
          const data = await response.json();

          sessions.replaceChildren();

          for (const r of data.results) {
            renderSessionItem(
              r.sessionId,
              r.content,
              `${r.role} · ${shortId(r.sessionId)} · ${formatDate(r.createdAt)}`,
            );
          }

          markActive();
        } catch {
          // Ignore search errors while typing.
        }
      }

      async function openSession(id) {
        sessionId = id;
        session.textContent = id;
        messages.replaceChildren();

        try {
          const response = await fetch(`/core/conversation/${id}`);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          for (const m of data.messages) {
            const bubble = addMessage(m.role, m.content);

            if (m.excludedFromContext) {
              bubble.classList.add('excluded');
              bubble.title = 'Excluded from LLM context by /undo';
            }
          }
        } catch (error) {
          addMessage('system', `Error: ${error.message}`);
        }

        markActive();
        input.focus();
      }

      newButton.addEventListener('click', () => {
        sessionId = null;
        session.textContent = 'new session';
        messages.replaceChildren();
        addMessage('system', 'New session.');
        markActive();
        input.focus();
      });

      function addMessage(role, content) {
        const element = document.createElement('div');

        element.className = `message ${role}`;
        element.textContent = content;

        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;

        return element;
      }

      function setBusy(busy) {
        send.disabled = busy;
        input.disabled = busy;
        send.textContent = busy ? '...' : 'Send';
      }

      async function sendMessage(message) {
        setBusy(true);

        const bubble = addMessage('assistant', 'Thinking...');
        bubble.classList.add('typing');

        try {
          const response = await fetch('/core/conversation/stream', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message,
              ...(sessionId ? { sessionId } : {}),
            }),
          });

          if (!response.ok || !response.body) {
            let detail = `HTTP ${response.status}`;

            try {
              const data = await response.json();
              detail = data.message || detail;
            } catch {
              // Non-JSON error body; keep the status text.
            }

            throw new Error(detail);
          }

          await readStream(response.body, bubble);
        } catch (error) {
          bubble.remove();

          addMessage('system', `Error: ${error.message}`);
        } finally {
          setBusy(false);
          input.focus();
        }
      }

      async function readStream(body, bubble) {
        const reader = body.getReader();
        const decoder = new TextDecoder();
        const state = { started: false };

        let buffer = '';

        for (;;) {
          const { done, value } = await reader.read();

          if (done) {
            break;
          }

          buffer += decoder.decode(value, { stream: true });

          let boundary = buffer.indexOf('\n\n');

          while (boundary >= 0) {
            handleEvent(buffer.slice(0, boundary), bubble, state);

            buffer = buffer.slice(boundary + 2);
            boundary = buffer.indexOf('\n\n');
          }
        }
      }

      function handleEvent(raw, bubble, state) {
        let name = '';
        let data = '';

        for (const line of raw.split('\n')) {
          if (line.startsWith('event:')) {
            name = line.slice(6).trim();
          } else if (line.startsWith('data:')) {
            data += line.slice(5).trim();
          }
        }

        if (!name || !data) {
          return;
        }

        const payload = JSON.parse(data);

        if (name === 'meta') {
          sessionId = payload.sessionId;
          session.textContent = sessionId;
        }

        if (name === 'token') {
          if (!state.started) {
            state.started = true;
            bubble.textContent = '';
            bubble.classList.remove('typing');
          }

          bubble.textContent += payload.content;
          messages.scrollTop = messages.scrollHeight;
        }

        if (name === 'done' && !bubble.textContent) {
          bubble.classList.remove('typing');
          bubble.textContent = payload.reply;
        }

        // Structured command results render as system notices, not
        // assistant messages. Session switches (/new, /fork) reset the pane.
        if (name === 'done' && payload.command) {
          bubble.className = 'message system';
          bubble.textContent = payload.reply;

          if (payload.command.kind === 'session') {
            messages.replaceChildren(bubble);
          }
        }

        if (name === 'error') {
          throw new Error(payload.message);
        }
      }

      composer.addEventListener('submit', async (event) => {
        event.preventDefault();

        const message = input.value.trim();

        if (!message || send.disabled) {
          return;
        }

        input.value = '';

        addMessage('user', message);

        await sendMessage(message);
        await refreshSessions();
      });

      // Enter sends.
      // Shift+Enter creates a newline.
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });

      refreshSessions();
    </script>
  </body>
</html>
