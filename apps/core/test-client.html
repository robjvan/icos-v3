<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICOS</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #111;
        color: #eee;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .app {
        width: min(900px, 100%);
        height: min(900px, 100vh);
        display: flex;
        flex-direction: column;
        background: #181818;
        border: 1px solid #333;
      }

      header {
        padding: 16px 20px;
        border-bottom: 1px solid #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      #session {
        color: #777;
        font-size: 11px;
        font-family: monospace;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 10px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .user {
        align-self: flex-end;
        background: #315b52;
      }

      .assistant {
        align-self: flex-start;
        background: #292929;
      }

      .system {
        align-self: center;
        color: #777;
        font-size: 12px;
      }

      .composer {
        border-top: 1px solid #333;
        padding: 12px;
        display: flex;
        gap: 10px;
      }

      textarea {
        flex: 1;
        resize: none;
        min-height: 48px;
        max-height: 160px;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #111;
        color: #eee;
        font: inherit;
        outline: none;
      }

      textarea:focus {
        border-color: #666;
      }

      button {
        width: 80px;
        border: 0;
        border-radius: 8px;
        background: #6f8f82;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #82a598;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .typing {
        opacity: 0.5;
        font-style: italic;
      }

      @media (max-width: 600px) {
        body {
          align-items: stretch;
        }

        .app {
          height: 100%;
          border: 0;
        }

        #messages {
          padding: 16px;
        }

        .message {
          max-width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header>
        <h1>ICOS</h1>
        <span id="session">new session</span>
      </header>

      <main id="messages">
        <div class="message system">Core online.</div>
      </main>

      <form class="composer" id="composer">
        <textarea
          id="input"
          placeholder="Talk to ICOS..."
          autocomplete="off"
          autofocus
        ></textarea>

        <button id="send" type="submit">Send</button>
      </form>
    </div>

    <script>
      let sessionId = null;

      const messages = document.getElementById('messages');
      const input = document.getElementById('input');
      const send = document.getElementById('send');
      const session = document.getElementById('session');
      const composer = document.getElementById('composer');

      function addMessage(role, content) {
        const element = document.createElement('div');

        element.className = `message ${role}`;
        element.textContent = content;

        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;

        return element;
      }

      function setBusy(busy) {
        send.disabled = busy;
        input.disabled = busy;
        send.textContent = busy ? '...' : 'Send';
      }

      async function sendMessage(message) {
        setBusy(true);

        const typing = addMessage('assistant', 'Thinking...');
        typing.classList.add('typing');

        try {
          const response = await fetch('/core/conversation', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message,
              ...(sessionId ? { sessionId } : {}),
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || `HTTP ${response.status}`);
          }

          sessionId = data.sessionId;

          session.textContent = sessionId;

          typing.remove();

          addMessage('assistant', data.reply);
        } catch (error) {
          typing.remove();

          addMessage('system', `Error: ${error.message}`);
        } finally {
          setBusy(false);
          input.focus();
        }
      }

      composer.addEventListener('submit', async (event) => {
        event.preventDefault();

        const message = input.value.trim();

        if (!message || send.disabled) {
          return;
        }

        input.value = '';

        addMessage('user', message);

        await sendMessage(message);
      });

      // Enter sends.
      // Shift+Enter creates a newline.
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });
    </script>
  </body>
</html>
