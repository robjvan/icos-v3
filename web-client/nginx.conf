# Single-page app: fall back to index.html so deep routes (/skills, …)
# resolve on refresh. Port matches docker-compose.yml (4200:4200) and the
# compose healthcheck (GET / must return 200).
server {
  listen 4200;
  listen [::]:4200;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
