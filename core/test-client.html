<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICOS</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #111;
        color: #eee;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .app {
        width: min(1200px, 100%);
        height: min(900px, 100vh);
        display: flex;
        flex-direction: column;
        background: #181818;
        border: 1px solid #333;
      }

      header {
        padding: 16px 20px;
        border-bottom: 1px solid #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      #session {
        color: #777;
        font-size: 11px;
        font-family: monospace;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 10px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .user {
        align-self: flex-end;
        background: #315b52;
      }

      .assistant {
        align-self: flex-start;
        background: #292929;
      }

      .system {
        align-self: center;
        color: #777;
        font-size: 12px;
      }

      .excluded {
        opacity: 0.45;
      }

      #approvals {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0 12px;
        max-height: 220px;
        overflow-y: auto;
      }

      #approvals:empty {
        display: none;
      }

      #questions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0 12px;
        max-height: 260px;
        overflow-y: auto;
      }

      #questions:empty {
        display: none;
      }

      .approval-card {
        border: 1px solid #8a6d3b;
        background: #26221a;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
      }

      .approval-card .action {
        font-weight: 600;
      }

      .approval-card .description {
        color: #bbb;
        margin-top: 4px;
        white-space: pre-wrap;
      }

      .approval-card .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .approval-card button {
        width: auto;
        padding: 6px 12px;
        font-size: 12px;
      }

      .approval-card .reject {
        background: #6e3b3b;
      }

      .question-card {
        border: 1px solid #4b7a94;
        background: #1a2229;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
      }

      .question-card .question {
        font-weight: 600;
      }

      .question-card .options {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
      }

      .question-card label {
        display: flex;
        gap: 8px;
        align-items: center;
        cursor: pointer;
      }

      .question-card input[type='text'] {
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #111;
        color: #eee;
        font: inherit;
        font-size: 13px;
        width: 100%;
        outline: none;
      }

      .question-card .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .question-card button {
        width: auto;
        padding: 6px 12px;
        font-size: 12px;
      }

      .question-card .dismiss {
        background: #555;
      }

      .composer {
        border-top: 1px solid #333;
        padding: 12px;
        display: flex;
        gap: 10px;
      }

      textarea {
        flex: 1;
        resize: none;
        min-height: 48px;
        max-height: 160px;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #111;
        color: #eee;
        font: inherit;
        outline: none;
      }

      textarea:focus {
        border-color: #666;
      }

      button {
        width: 80px;
        border: 0;
        border-radius: 8px;
        background: #6f8f82;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #82a598;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .typing {
        opacity: 0.5;
        font-style: italic;
      }

      .new-btn {
        width: auto;
        padding: 8px 14px;
        font-size: 13px;
      }

      .body {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      .sidebar {
        width: 260px;
        flex-shrink: 0;
        border-right: 1px solid #333;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      #search {
        margin: 12px;
        padding: 10px 12px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #111;
        color: #eee;
        font: inherit;
        font-size: 13px;
        outline: none;
      }

      #search:focus {
        border-color: #666;
      }

      #sessions {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .session-item {
        padding: 10px 12px;
        border: 1px solid #333;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
      }

      .session-item:hover {
        border-color: #555;
      }

      .session-item.active {
        border-color: #6f8f82;
        background: #202624;
      }

      .session-item .title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-item .meta {
        color: #777;
        font-size: 11px;
        margin-top: 4px;
        font-family: monospace;
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      @media (max-width: 700px) {
        .body {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          border-right: 0;
          border-bottom: 1px solid #333;
          max-height: 180px;
        }
      }

      @media (max-width: 600px) {
        body {
          align-items: stretch;
        }

        .app {
          height: 100%;
          border: 0;
        }

        #messages {
          padding: 16px;
        }

        .message {
          max-width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header>
        <h1>ICOS</h1>
        <span id="session">new session</span>
        <button class="new-btn" id="new" type="button">+ New</button>
      </header>

      <div class="body">
        <aside class="sidebar">
          <input id="search" placeholder="Search sessions..." autocomplete="off" />
          <div id="sessions"></div>
        </aside>

        <div class="main">
          <main id="messages">
            <div class="message system">Core online.</div>
          </main>

          <div id="approvals"></div>
          <div id="questions"></div>

          <form class="composer" id="composer">
            <textarea
              id="input"
              placeholder="Talk to ICOS..."
              autocomplete="off"
              autofocus
            ></textarea>

            <button id="send" type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      let sessionId = null;

      const messages = document.getElementById('messages');
      const input = document.getElementById('input');
      const send = document.getElementById('send');
      const session = document.getElementById('session');
      const composer = document.getElementById('composer');
      const sessions = document.getElementById('sessions');
      const search = document.getElementById('search');
      const newButton = document.getElementById('new');
      const approvals = document.getElementById('approvals');
      const questions = document.getElementById('questions');

      // Parked tool turns: approvalId -> { requestId, sessionId }. Filled
      // when a stream ends in `approval_required`; consumed when that
      // approval resolves, so the turn resumes exactly once.
      const pendingResumes = new Map();

      function shortId(id) {
        return id.slice(0, 8);
      }

      function formatDate(iso) {
        return new Date(iso).toLocaleString();
      }

      function markActive() {
        for (const item of sessions.children) {
          item.classList.toggle('active', item.dataset.id === sessionId);
        }
      }

      function renderSessionItem(id, title, meta) {
        const item = document.createElement('div');
        item.className = 'session-item';
        item.dataset.id = id;

        const titleEl = document.createElement('div');
        titleEl.className = 'title';
        titleEl.textContent = title;

        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = meta;

        item.appendChild(titleEl);
        item.appendChild(metaEl);
        item.addEventListener('click', () => openSession(id));
        sessions.appendChild(item);
      }

      async function refreshSessions() {
        if (search.value.trim()) {
          return;
        }

        try {
          const response = await fetch('/core/sessions?limit=50');
          const data = await response.json();

          sessions.replaceChildren();

          for (const s of data.sessions) {
            renderSessionItem(
              s.sessionId,
              s.title || s.preview || `Session ${shortId(s.sessionId)}`,
              `${s.messageCount} msgs · ${formatDate(s.updatedAt)}`,
            );
          }

          markActive();
        } catch {
          // Sidebar is auxiliary; chat must keep working.
        }
      }

      let searchTimer = null;

      search.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(runSearch, 250);
      });

      async function runSearch() {
        const q = search.value.trim();

        if (!q) {
          await refreshSessions();
          return;
        }

        try {
          const response = await fetch(
            `/core/sessions/search?q=${encodeURIComponent(q)}&limit=50`,
          );
          const data = await response.json();

          sessions.replaceChildren();

          for (const r of data.results) {
            renderSessionItem(
              r.sessionId,
              r.content,
              `${r.role} · ${shortId(r.sessionId)} · ${formatDate(r.createdAt)}`,
            );
          }

          markActive();
        } catch {
          // Ignore search errors while typing.
        }
      }

      async function refreshApprovals() {
        approvals.replaceChildren();

        if (!sessionId) {
          return;
        }

        try {
          const response = await fetch(
            `/core/approvals?sessionId=${encodeURIComponent(sessionId)}&status=pending`,
          );

          if (!response.ok) {
            return;
          }

          const data = await response.json();

          for (const a of data.approvals) {
            approvals.appendChild(renderApproval(a));
          }
        } catch {
          // Approvals are auxiliary; chat must keep working.
        }
      }

      function renderApproval(approval) {
        const card = document.createElement('div');
        card.className = 'approval-card';

        const title = document.createElement('div');
        title.className = 'action';
        title.textContent = `Approval required: ${approval.action}`;

        card.appendChild(title);

        if (approval.description) {
          const description = document.createElement('div');
          description.className = 'description';
          description.textContent = approval.description;
          card.appendChild(description);
        }

        const row = document.createElement('div');
        row.className = 'row';

        const approve = document.createElement('button');
        approve.type = 'button';
        approve.textContent = 'Approve';
        approve.addEventListener('click', () =>
          resolveApproval(approval.id, 'approve'),
        );

        const reject = document.createElement('button');
        reject.type = 'button';
        reject.textContent = 'Reject';
        reject.className = 'reject';
        reject.addEventListener('click', () =>
          resolveApproval(approval.id, 'reject'),
        );

        row.appendChild(approve);
        row.appendChild(reject);
        card.appendChild(row);

        return card;
      }

      async function resolveApproval(id, decision) {
        try {
          await fetch(`/core/approvals/${id}/${decision}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId }),
          });
        } catch {
          // Fall through to refresh; failures stay visible as pending.
        }

        await refreshApprovals();

        // A resolved tool approval unparks its turn. Resume works for
        // approve and reject alike (reject renders the parked turn's
        // mirror notice); unknown ids mean no parked turn exists.
        const parked = pendingResumes.get(id);

        if (parked) {
          pendingResumes.delete(id);
          await resumeTurn(parked.requestId, parked.sessionId);
        }
      }

      async function refreshQuestions() {
        questions.replaceChildren();

        if (!sessionId) {
          return;
        }

        try {
          const response = await fetch(
            `/core/clarifications?sessionId=${encodeURIComponent(sessionId)}&status=pending`,
          );

          if (!response.ok) {
            return;
          }

          const data = await response.json();

          for (const q of data.clarifications) {
            questions.appendChild(renderQuestion(q));
          }
        } catch {
          // Questions are auxiliary; chat must keep working.
        }
      }

      function renderQuestion(clarification) {
        const card = document.createElement('div');
        card.className = 'question-card';

        const title = document.createElement('div');
        title.className = 'question';
        title.textContent = clarification.question;
        card.appendChild(title);

        let getAnswer;

        if (clarification.options && clarification.options.length > 0) {
          const options = document.createElement('div');
          options.className = 'options';

          const radios = [];

          for (const option of clarification.options) {
            const label = document.createElement('label');

            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `q-${clarification.id}`;
            radio.value = option;

            if (radios.length === 0) {
              radio.checked = true;
            }

            radios.push(radio);
            label.appendChild(radio);
            label.appendChild(document.createTextNode(option));
            options.appendChild(label);
          }

          card.appendChild(options);
          getAnswer = () => {
            const selected = radios.find((r) => r.checked);
            return selected ? selected.value : '';
          };
        } else {
          const field = document.createElement('input');
          field.type = 'text';
          field.placeholder = 'Your answer...';
          card.appendChild(field);
          getAnswer = () => field.value.trim();
        }

        const row = document.createElement('div');
        row.className = 'row';

        const submit = document.createElement('button');
        submit.type = 'button';
        submit.textContent = 'Answer';
        submit.addEventListener('click', async () => {
          const answer = getAnswer();

          if (!answer) {
            return;
          }

          await answerQuestion(clarification.id, answer);
        });

        const dismiss = document.createElement('button');
        dismiss.type = 'button';
        dismiss.textContent = 'Dismiss';
        dismiss.className = 'dismiss';
        dismiss.addEventListener('click', () =>
          cancelQuestion(clarification.id),
        );

        row.appendChild(submit);
        row.appendChild(dismiss);
        card.appendChild(row);

        return card;
      }

      async function answerQuestion(id, answer) {
        try {
          await fetch(`/core/clarifications/${id}/answer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, answer }),
          });
        } catch {
          // Fall through to refresh; failures stay visible as pending.
        }

        await refreshQuestions();
      }

      async function cancelQuestion(id) {
        try {
          await fetch(`/core/clarifications/${id}/cancel`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId }),
          });
        } catch {
          // Fall through to refresh.
        }

        await refreshQuestions();
      }

      async function openSession(id) {
        sessionId = id;
        session.textContent = id;
        messages.replaceChildren();

        try {
          const response = await fetch(`/core/conversation/${id}`);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          for (const m of data.messages) {
            const bubble = addMessage(m.role, m.content);

            if (m.excludedFromContext) {
              bubble.classList.add('excluded');
              bubble.title = 'Excluded from LLM context by /undo';
            }
          }
        } catch (error) {
          addMessage('system', `Error: ${error.message}`);
        }

        await refreshApprovals();
        await refreshQuestions();
        markActive();
        input.focus();
      }

      newButton.addEventListener('click', () => {
        sessionId = null;
        session.textContent = 'new session';
        messages.replaceChildren();
        approvals.replaceChildren();
        questions.replaceChildren();
        addMessage('system', 'New session.');
        markActive();
        input.focus();
      });

      function addMessage(role, content) {
        const element = document.createElement('div');

        element.className = `message ${role}`;
        element.textContent = content;

        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;

        return element;
      }

      function setBusy(busy) {
        send.disabled = busy;
        input.disabled = busy;
        send.textContent = busy ? '...' : 'Send';
      }

      async function sendMessage(message) {
        setBusy(true);

        const bubble = addMessage('assistant', 'Thinking...');
        bubble.classList.add('typing');

        try {
          const response = await fetch('/core/conversation/stream', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message,
              ...(sessionId ? { sessionId } : {}),
            }),
          });

          if (!response.ok || !response.body) {
            let detail = `HTTP ${response.status}`;

            try {
              const data = await response.json();
              detail = data.message || detail;
            } catch {
              // Non-JSON error body; keep the status text.
            }

            throw new Error(detail);
          }

          await readStream(response.body, bubble);
        } catch (error) {
          bubble.remove();

          addMessage('system', `Error: ${error.message}`);
        } finally {
          setBusy(false);
          input.focus();
        }
      }

      // Finish a parked (`approval_required`) or still-running
      // (`processing`) tool turn through the durable resume endpoint.
      // Never re-executes: the stored record answers. `attempt` bounds
      // chained `processing` polls across streams.
      async function resumeTurn(requestId, resumeSessionId, attempt = 0) {
        const bubble = addMessage('assistant', 'Resuming...');
        bubble.classList.add('typing');

        try {
          const response = await fetch('/core/conversation/resume-stream', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              requestId,
              sessionId: resumeSessionId,
            }),
          });

          if (!response.ok || !response.body) {
            let detail = `HTTP ${response.status}`;

            try {
              const data = await response.json();
              detail = data.message || detail;
            } catch {
              // Non-JSON error body; keep the status text.
            }

            throw new Error(detail);
          }

          await readStream(response.body, bubble, attempt);
        } catch (error) {
          bubble.remove();

          addMessage('system', `Error: ${error.message}`);
          return;
        }

        // Resume can rename the session, so refresh like a fresh turn.
        await refreshSessions();
        await refreshApprovals();
        await refreshQuestions();
      }

      async function readStream(body, bubble, firstResume = 0) {
        const reader = body.getReader();
        const decoder = new TextDecoder();
        const state = { started: false, resumes: firstResume };

        let buffer = '';

        for (;;) {
          const { done, value } = await reader.read();

          if (done) {
            break;
          }

          buffer += decoder.decode(value, { stream: true });

          let boundary = buffer.indexOf('\n\n');

          while (boundary >= 0) {
            handleEvent(buffer.slice(0, boundary), bubble, state);

            buffer = buffer.slice(boundary + 2);
            boundary = buffer.indexOf('\n\n');
          }
        }
      }

      function handleEvent(raw, bubble, state) {
        let name = '';
        let data = '';

        for (const line of raw.split('\n')) {
          if (line.startsWith('event:')) {
            name = line.slice(6).trim();
          } else if (line.startsWith('data:')) {
            data += line.slice(5).trim();
          }
        }

        if (!name || !data) {
          return;
        }

        const payload = JSON.parse(data);

        if (name === 'meta') {
          sessionId = payload.sessionId;
          session.textContent = sessionId;
        }

        if (name === 'token') {
          if (!state.started) {
            state.started = true;
            bubble.textContent = '';
            bubble.classList.remove('typing');
          }

          bubble.textContent += payload.content;
          messages.scrollTop = messages.scrollHeight;
        }

        if (name === 'tool' && !state.started) {
          // Mid-turn progress. Streamed tokens always win once they arrive.
          bubble.textContent = `Running tool ${payload.name}...`;
        }

        if (name === 'approval') {
          // Surface the approval card early; the turn still ends in `done`.
          void refreshApprovals();
        }

        if (name === 'done' && !state.started) {
          bubble.classList.remove('typing');
          bubble.textContent = payload.reply;
        }

        // Structured command results render as system notices, not
        // assistant messages. Session switches (/new, /fork) reset the pane.
        if (name === 'done' && payload.command) {
          bubble.className = 'message system';
          bubble.textContent = payload.reply;

          if (payload.command.kind === 'session') {
            messages.replaceChildren(bubble);
          }
        }

        // Tool turns. A parked approval remembers its durable request so
        // the approvals panel can resume it; a finished tool leaves a
        // trace line; a still-running tool is polled a bounded number of
        // times through the durable resume endpoint (never re-executed).
        if (name === 'done' && !payload.command) {
          if (payload.status === 'approval_required' && payload.approval) {
            bubble.className = 'message system';
            pendingResumes.set(payload.approval.approvalId, {
              requestId: payload.requestId,
              sessionId,
            });
          } else if (payload.status === 'processing') {
            if (state.resumes < 10) {
              setTimeout(
                () =>
                  void resumeTurn(
                    payload.requestId,
                    sessionId,
                    state.resumes + 1,
                  ),
                1000,
              );
            } else {
              bubble.textContent += ' (still running — send a message to retry)';
            }
          } else if (payload.tool) {
            addMessage('system', `Tool ran: ${payload.tool.name}`);
          }
        }

        if (name === 'error') {
          throw new Error(payload.message);
        }
      }

      composer.addEventListener('submit', async (event) => {
        event.preventDefault();

        const message = input.value.trim();

        if (!message || send.disabled) {
          return;
        }

        input.value = '';

        addMessage('user', message);

        await sendMessage(message);
        await refreshSessions();
        await refreshApprovals();
        await refreshQuestions();
      });

      // Enter sends.
      // Shift+Enter creates a newline.
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });

      refreshSessions();
    </script>
  </body>
</html>
